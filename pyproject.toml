[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humigence"
version = "1.0.0"
description = "Your AI. Your pipeline. Zero code."
authors = [{name = "Humigence Team"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "inquirerpy>=0.3.4",
    "rich>=13.0.0",
    "torch>=2.0.0",
    "accelerate>=0.24.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "transformers>=4.36.0",
    "datasets>=2.14.0",
    "psutil>=5.9.0",
    "huggingface_hub>=0.19.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
]

[project.scripts]
humigence = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "config*", "pipelines*", "templates*", "utils*"]
